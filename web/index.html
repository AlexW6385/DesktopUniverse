<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DesktopUniverse · 粒子宇宙</title>
<meta name="description" content="41 个可以用鼠标玩的粒子宇宙：星系、黏菌、雪花、蝴蝶效应、混沌摆、星尘时钟……一个 macOS 动态壁纸的网页版。">
<meta property="og:title" content="DesktopUniverse · 粒子宇宙">
<meta property="og:description" content="41 个可以用鼠标玩的粒子宇宙，macOS 动态壁纸的网页版">
<meta property="og:image" content="thumbs/galaxy.jpg">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M32 8l5 19 19 5-19 5-5 19-5-19-19-5 19-5z' fill='%23e9c27b'/%3E%3C/svg%3E">
<style>
  :root {
    --glass: rgba(14, 16, 22, .72); --glass2: rgba(22, 25, 33, .9); --line: rgba(255, 255, 255, .09);
    --text: #e6e9ef; --muted: #8d95a5; --faint: #5d6574; --accent: #e9c27b; --warn: #f0896b; --ok: #84d39a;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); overflow: hidden;
               font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  canvas#sky { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: crosshair; }
  body.hide-ui canvas#sky { cursor: none; }
  button, select, input { font: inherit; color: var(--text); }
  button { background: transparent; border: 0; cursor: pointer; padding: 0; }

  /* ------------------------------------------------ title card */
  #hud { position: fixed; left: 22px; top: 18px; max-width: min(520px, calc(100vw - 44px)); pointer-events: none;
         transition: opacity .8s ease; text-shadow: 0 1px 12px rgba(0, 0, 0, .9); }
  #hud.dim { opacity: .0; }
  #hud .brand { font-size: 12px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  #hud .brand b { color: var(--accent); font-weight: 600; }
  #hud h1 { margin: 2px 0 4px; font-size: 26px; font-weight: 600; letter-spacing: .04em; }
  #hud h1 .slot { font-size: 13px; color: var(--faint); font-weight: 500; margin-left: 8px; letter-spacing: 0; }
  #hud p { margin: 0; color: #c4c9d3; font-size: 13.5px; line-height: 1.6; }

  /* ------------------------------------------------ control bar */
  #bar { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translate(-50%, 0);
         display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 16px;
         background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(1.3);
         -webkit-backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
         transition: opacity .35s ease, transform .35s ease; white-space: nowrap; max-width: calc(100vw - 16px); }
  #bar.away { opacity: 0; transform: translate(-50%, 24px); pointer-events: none; }
  #bar button { height: 36px; min-width: 36px; padding: 0 11px; border-radius: 11px; color: #cfd4dd;
                display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; }
  #bar button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
  #bar button.on { color: var(--accent); background: rgba(233, 194, 123, .1); }
  #bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  #bar #bTitle { min-width: 120px; font-weight: 600; color: #fff; }
  #bar svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #bar .label { display: inline; }
  @media (max-width: 760px) { #bar .label { display: none; } #bar #bTitle .label { display: inline; } #bar .wide { display: none; } }

  #fps { position: fixed; right: 14px; top: 12px; font: 12px var(--mono); color: var(--faint); pointer-events: none; display: none; white-space: pre;
         text-align: right; text-shadow: 0 1px 6px #000; }
  #fps.show { display: block; }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px;
           background: var(--glass); border: 1px solid var(--line); color: #d7dbe3; font-size: 13px; opacity: 0;
           transition: opacity .4s; pointer-events: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           max-width: calc(100vw - 32px); text-align: center; }
  #toast.show { opacity: 1; }
  kbd { font: 11px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, .18); color: #e8e8e8; }

  /* ------------------------------------------------ gallery */
  .overlay { position: fixed; inset: 0; background: rgba(4, 5, 8, .82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
             overflow-y: auto; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  #gallery .wrap { max-width: 1240px; margin: 0 auto; padding: 34px 26px 60px; }
  #gallery header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 8px; }
  #gallery h2 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: .02em; }
  #gallery h2 b { color: var(--accent); font-weight: 600; }
  #gallery .about { color: var(--muted); max-width: 760px; margin: 6px 0 0; font-size: 13.5px; line-height: 1.7; }
  #gallery .about a { color: var(--accent); text-decoration: none; }
  #gallery .about a:hover { text-decoration: underline; }
  #gallery .close { font-size: 24px; color: var(--muted); width: 40px; height: 40px; border-radius: 10px; flex: none; }
  #gallery .close:hover { background: rgba(255, 255, 255, .08); color: #fff; }
  #gallery h3 { font-size: 15px; font-weight: 600; color: #fff; margin: 28px 0 10px; letter-spacing: .06em; }
  #gallery h3 span { color: var(--faint); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 12px; }
  .card { position: relative; border-radius: 12px; overflow: hidden; background: #0b0d12; border: 1px solid var(--line);
          aspect-ratio: 16 / 10; text-align: left; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); border-color: rgba(233, 194, 123, .55); }
  .card.current { border-color: var(--accent); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .ph { width: 100%; height: 100%; background: radial-gradient(circle at 30% 30%, #2a2f3d, #0b0d12 70%); }
  .card .name { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 11px 8px; font-size: 13.5px; font-weight: 600;
                background: linear-gradient(transparent, rgba(0, 0, 0, .85)); color: #fff; display: flex; justify-content: space-between; }
  .card .name small { color: var(--faint); font-weight: 500; }

  /* ------------------------------------------------ tuning panel */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); z-index: 15; background: var(--glass2);
           border-left: 1px solid var(--line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
           transform: translateX(100%); transition: transform .28s ease; display: flex; flex-direction: column; font-size: 13px; }
  #panel.open { transform: none; box-shadow: -20px 0 60px rgba(0, 0, 0, .5); }
  #panel .head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  #panel .row1 { display: flex; gap: 6px; align-items: center; }
  #panel .row1 h2 { font-size: 15px; margin: 0; flex: 1; font-weight: 600; }
  #panel .tools { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  #panel .tools button, #panel .small, #panel select, #panel input[type=text], #panel input[type=number] {
    background: #1d2129; border: 1px solid #2c3240; border-radius: 6px; }
  #panel .tools button { padding: 3px 9px; font-size: 12px; }
  #panel button:hover:not(:disabled) { border-color: var(--accent); }
  #panel button:disabled { opacity: .35; cursor: default; }
  #panel button.danger:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); }
  #panel .x { font-size: 20px; width: 30px; height: 30px; border: 0 !important; background: none !important; color: var(--muted); }
  #panelSel { width: 100%; margin-top: 8px; padding: 4px 6px; }
  #namebox { display: none; gap: 6px; margin-top: 8px; }
  #namebox.show { display: flex; }
  #namebox input { flex: 1; padding: 3px 6px; }
  #pdesc { color: var(--muted); margin-top: 8px; font-size: 12.5px; }
  #pstatus { margin-top: 6px; color: var(--faint); font: 11.5px/1.5 var(--mono); }
  #pstatus .warn { color: var(--warn); } #pstatus .msg { color: var(--ok); } #pstatus .tree { color: var(--accent); }
  #form { overflow-y: auto; padding: 10px 12px 60px; flex: 1; }
  #form details { background: rgba(255, 255, 255, .025); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px; }
  #form details details { background: rgba(0, 0, 0, .18); margin: 7px 0; }
  #form summary { cursor: pointer; padding: 7px 10px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 7px; }
  #form summary::-webkit-details-marker { display: none; }
  #form summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  #form details[open] > summary::before { transform: rotate(90deg); }
  #form summary .tag { font-weight: 400; color: var(--muted); font: 11.5px var(--mono); white-space: nowrap;
                       overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #form summary > span:first-child { white-space: nowrap; }
  #form summary .small { white-space: nowrap; flex: none; }
  #form summary .spacer { flex: 1; }
  #form .body { padding: 2px 10px 9px; }
  #form .row { display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: center; padding: 2px 0; }
  #form .row > label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #form .num { display: grid; grid-template-columns: 1fr 74px; gap: 6px; align-items: center; }
  #form .num input[type=number] { width: 74px; padding: 1px 4px; }
  #form .vec { display: grid; grid-template-columns: 1fr; gap: 3px; }
  #form .vec .num { grid-template-columns: 12px 1fr 64px; }
  #form .vec .num input[type=number] { width: 64px; }
  #form .vec .num span { color: var(--faint); }
  #form input[type=range] { width: 100%; accent-color: var(--accent); }
  #form input[type=color] { width: 44px; height: 22px; padding: 0 2px; background: none; border: 1px solid #2c3240; border-radius: 5px; }
  #form input[type=text] { width: 100%; padding: 2px 6px; }
  #form .inline { display: flex; gap: 6px; align-items: center; }
  #form .hint { color: var(--faint); font-size: 11.5px; margin: 0 0 3px 120px; }
  #form .sub { color: var(--accent); font-size: 12px; margin: 12px 0 4px; font-weight: 600; }
  #form .pull { border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; margin: 7px 0; background: rgba(0, 0, 0, .2); }
  #form .pull.off { opacity: .5; }
  #form .pullhead { display: flex; gap: 6px; align-items: center; margin-bottom: 3px; flex-wrap: wrap; }
  #form .pullhead .spacer { flex: 1; }
  #form .small { padding: 0 7px; font-size: 12px; }
  #form .adders { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  #form .adders button { padding: 3px 9px; background: #1d2129; border: 1px solid #2c3240; border-radius: 6px; }
  @media (max-width: 520px) { #form .row { grid-template-columns: 1fr; gap: 1px; } #form .hint { margin-left: 0; } }

  #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
           padding: 30px; color: var(--muted); }
  #fatal.show { display: flex; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="hud">
  <div class="brand"><b>Desktop</b>Universe · <span id="hGroup"></span></div>
  <h1><span id="hTitle"></span><span class="slot" id="hSlot"></span></h1>
  <p id="hDesc"></p>
</div>
<div id="fps"></div>
<div id="toast"></div>

<nav id="bar" aria-label="控制">
  <button id="bPrev" title="上一个（←）"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="bTitle" title="全部预设（G）"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span class="label" id="barTitle"></span></button>
  <button id="bNext" title="下一个（→）"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <span class="sep"></span>
  <button id="bPause" title="暂停（空格）"><svg viewBox="0 0 24 24" id="iPause"><path d="M8 5v14M16 5v14"/></svg><span class="label" id="lPause">暂停</span></button>
  <button id="bClear" class="wide" title="清屏（C）"><svg viewBox="0 0 24 24"><path d="M5 19h14M7 15l8-10 4 3-8 10H7z"/></svg><span class="label">清屏</span></button>
  <button id="bRestart" title="重新开始（R）"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg><span class="label">重开</span></button>
  <span class="sep"></span>
  <button id="bRotate" title="自动轮播：每 30 秒换一个"><svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M20 6H9a5 5 0 0 0-5 5M7 21l-3-3 3-3M4 18h11a5 5 0 0 0 5-5"/></svg><span class="label">轮播</span></button>
  <button id="bTune" title="调参（P）"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="label">调参</span></button>
  <button id="bFull" class="wide" title="全屏（F）"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="bGithub" class="wide" title="源代码（桌面版）"><svg viewBox="0 0 24 24"><path d="M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6.2 0C6.6 2.8 5.6 3.1 5.6 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4.2 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg></button>
</nav>

<div id="gallery" class="overlay" role="dialog" aria-label="全部预设">
  <div class="wrap">
    <header>
      <div>
        <h2><b>Desktop</b>Universe</h2>
        <p class="about">41 个粒子宇宙，每一个都只是几百字节的参数，跑在同一个引擎上：引力和漩涡、鸟群和鱼群、会自己长的雪花、
          会找食物的黏菌、三维奇异吸引子、九百个双摆、用星尘写的时钟和唐诗……移动鼠标、按住、点击，都会和它们互动。
          它原本是一个 macOS 动态壁纸（Python），这里是同一个引擎移植到浏览器的版本，
          <a href="https://github.com/AlexW6385/DesktopUniverse" target="_blank" rel="noopener">源代码和桌面版在 GitHub</a>。
          键盘：<kbd>←</kbd> <kbd>→</kbd> 换一个 · <kbd>1</kbd>–<kbd>9</kbd> 精选 · <kbd>空格</kbd> 暂停 · <kbd>C</kbd> 清屏 ·
          <kbd>R</kbd> 重开 · <kbd>P</kbd> 调参 · <kbd>H</kbd> 隐藏界面 · <kbd>F</kbd> 全屏</p>
      </div>
      <button class="close" id="gClose" title="关闭（Esc）">×</button>
    </header>
    <div id="gGroups"></div>
  </div>
</div>

<aside id="panel" aria-label="调参">
  <div class="head">
    <div class="row1"><h2>调参</h2><button class="x" id="pClose" title="关闭（Esc）">×</button></div>
    <select id="panelSel" title="预设"></select>
    <div class="tools">
      <button id="pNew" title="从一个空白预设开始">新建</button>
      <button id="pSave" title="把改动存回这个预设（只能存你自己的）">保存</button>
      <button id="pSaveAs">另存为…</button>
      <button id="pRename">重命名…</button>
      <button id="pDelete" class="danger">删除</button>
      <button id="pReset" title="丢掉没保存的改动">还原</button>
      <button id="pExport" title="下载成 JSON：放进桌面版的 presets_user/ 文件夹就能用">导出</button>
      <button id="pImport" title="读入一个 JSON 预设（桌面版的 presets_user/ 里的也行）">导入</button>
    </div>
    <div id="namebox"><input id="nameInput" type="text"><button id="nameOk" class="small">确定</button></div>
    <div id="pdesc"></div>
    <div id="pstatus"></div>
  </div>
  <div id="form"></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
</aside>

<div id="fatal"></div>
<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#888">需要开启 JavaScript</div></noscript>

<script src="data.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/panel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
