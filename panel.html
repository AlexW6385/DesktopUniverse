<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DesktopUniverse</title>
<style>
  :root {
    --bg: #0c0e13; --card: #151922; --card2: #11151c; --line: #252b37; --text: #dde2ea;
    --muted: #7c8595; --faint: #545c6b; --accent: #e9c27b; --warn: #f0896b; --ok: #84d39a;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.45 -apple-system, "Helvetica Neue", "PingFang SC", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(12,14,19,.95);
           backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 10px 16px 8px; }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0 10px 0 0; letter-spacing: .02em; white-space: nowrap; }
  h1 span { color: var(--accent); }
  select, input, button { font: inherit; color: var(--text); background: #1c212b;
                          border: 1px solid var(--line); border-radius: 6px; }
  select, input[type=text], input[type=number] { padding: 3px 6px; }
  button { padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  button.danger:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); }
  button.small { padding: 1px 7px; font-size: 12px; }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  #presetSel { min-width: 180px; }
  #namebox { display: none; gap: 6px; align-items: center; }
  #namebox.show { display: inline-flex; }
  #desc { color: var(--muted); margin-top: 6px; }
  #status { margin-top: 4px; color: var(--faint); font-family: var(--mono); font-size: 12px; }
  #status .warn { color: var(--warn); }
  #status .msg { color: var(--ok); }
  #status .tree { color: var(--accent); }
  main { padding: 14px 16px 80px; max-width: 820px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  details details { background: var(--card2); margin: 8px 0; }
  summary { cursor: pointer; padding: 9px 12px; font-weight: 600; list-style: none;
            display: flex; align-items: center; gap: 8px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary .tag { font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  summary .spacer { flex: 1; }
  .body { padding: 2px 12px 10px; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: center; padding: 3px 0; }
  .row > label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: center; }
  .num input[type=number] { width: 96px; }
  .vec { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .vec .num { grid-template-columns: 14px 1fr 70px; }
  .vec .num input[type=number] { width: 70px; }
  .vec .num span { color: var(--faint); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 46px; height: 24px; padding: 0 2px; }
  .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--faint); font-size: 12px; margin: 0 0 4px 180px; }
  .sub { color: var(--accent); font-size: 12px; margin: 12px 0 2px; font-weight: 600; }
  .pull { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 8px 0; background: var(--card2); }
  .pull.off { opacity: .5; }
  .pullhead { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .pullhead .spacer { flex: 1; }
  .adders { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; gap: 2px; } .hint { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Desktop<span>Universe</span></h1>
    <select id="presetSel" title="Preset (built-ins: keys 1–9)"></select>
    <button id="bNew" title="Start from a blank preset">New</button>
    <button id="bSave" title="Save the changes into this preset">Save</button>
    <button id="bSaveAs">Save as…</button>
    <button id="bRename">Rename…</button>
    <button id="bDelete" class="danger">Delete</button>
    <span id="namebox"><input id="nameInput" type="text" size="16"><button id="nameOk">OK</button></span>
    <span class="sep"></span>
    <button id="bReset" title="Throw away the unsaved changes">Revert</button>
    <button id="bRestart" title="Start over with these settings">Restart</button>
    <button id="bPause">Pause</button>
    <button id="bClear">Clear</button>
    <button id="bQuit" class="danger">Quit</button>
  </div>
  <div id="desc"></div>
  <div id="status">Connecting…</div>
</header>
<main id="form"></main>

<script>
const HEAD = { "Content-Type": "application/json", "X-Desktop-Universe": "1" };
let SCHEMA = null, LAWS = {}, S = null, P = null, version = -1, timer = null, nameMode = null;
const WHEN_KEYS = new Set();

const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
async function post(path, body) {
  try { await fetch(path, { method: "POST", headers: HEAD, body: JSON.stringify(body) }); } catch (e) {}
}
const cmd = (name, extra = {}) => post("/api/cmd", { cmd: name, ...extra });
function changed(rerender = false) {
  if (rerender) render();
  clearTimeout(timer);
  timer = setTimeout(() => post("/api/preset", P), 40);
}
const tidy = (v) => Number(Number(v).toPrecision(5));
const getp = (o, path) => path.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
function setp(o, path, v) { const ks = path.split("."); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; }
const hex = (c) => "#" + c.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

function visible(spec, obj) {
  if (!spec.when) return true;
  return Object.entries(spec.when).every(([k, want]) => {
    const v = k.startsWith("preset.") ? getp(P, k.slice(7)) : getp(obj, k);
    return want === "nonzero" ? !!v : want.includes(v);
  });
}

// ------------------------------------------------------------ controls
function slider(get, set, o, rerenderKey) {
  const wrap = el("div", "num");
  const range = el("input"); range.type = "range";
  const box = el("input"); box.type = "number"; box.step = o.step ?? "any";
  const isLog = o.kind === "log", isInt = o.kind === "int" || o.int;
  let lo = o.min ?? 0, hi = o.max ?? 100;
  const v0 = get();
  if (!isLog && typeof v0 === "number") {
    if (v0 > hi) hi = v0 * 1.5;
    if (v0 < lo) lo = v0 < 0 ? v0 * 1.5 : v0;
  }
  if (o.symmetric) { const m = Math.max(Math.abs(lo), Math.abs(hi)); lo = -m; hi = m; }
  const llo = isLog ? Math.log10(Math.max(o.min, 1e-9)) : 0, lhi = isLog ? Math.log10(o.max) : 0;
  const toS = (v) => isLog ? (v <= 0 ? 0 : Math.max(1, Math.min(1000, (Math.log10(v) - llo) / (lhi - llo) * 1000))) : v;
  const fromS = (s) => isLog ? (s <= 0 ? 0 : Math.pow(10, llo + (lhi - llo) * s / 1000)) : s;
  if (isLog) { range.min = 0; range.max = 1000; range.step = 1; }
  else { range.min = lo; range.max = hi; range.step = o.step ?? (hi - lo) / 400; }
  const show = () => {
    const v = get();
    box.value = v === null || v === undefined ? "" : v;
    range.value = v === null || v === undefined ? (isLog ? 1000 : hi) : toS(v);
  };
  show();
  if (o.nullable) box.placeholder = "∞";
  range.oninput = () => {
    let v = fromS(+range.value); v = isInt ? Math.round(v) : tidy(v);
    set(v); box.value = v; changed();
  };
  range.onchange = () => { if (rerenderKey) render(); };
  box.onchange = () => {
    if (box.value === "" && o.nullable) set(null);
    else if (box.value !== "") set(isInt ? Math.round(+box.value) : +box.value);
    show(); changed(!!rerenderKey);
  };
  wrap.append(range, box);
  return wrap;
}

function control(spec, obj) {
  const get = () => getp(obj, spec.key), set = (v) => setp(obj, spec.key, v);
  const rr = WHEN_KEYS.has(spec.key);
  switch (spec.kind) {
    case "text": {
      const t = el("input"); t.type = "text"; t.value = get() ?? "";
      t.onchange = () => { set(t.value.trim()); changed(true); };
      return t;
    }
    case "bool": {
      const lab = el("label", "inline"); const c = el("input"); c.type = "checkbox"; c.checked = !!get();
      c.onchange = () => { set(c.checked); changed(true); };
      lab.append(c); return lab;
    }
    case "sel": {
      const s = el("select");
      for (const [v, t] of spec.options) { const o = el("option", null, t); o.value = v; s.appendChild(o); }
      s.value = get();
      s.onchange = () => { set(s.value); changed(true); };
      return s;
    }
    case "color": {
      const c = el("input"); c.type = "color"; c.value = hex(get() || [255, 255, 255]);
      c.oninput = () => { set(rgb(c.value)); changed(); };
      return c;
    }
    case "vec2": {
      const v = el("div", "vec");
      [0, 1].forEach((i) => {
        const s = slider(() => get()[i], (x) => { get()[i] = x; }, spec);
        s.prepend(el("span", null, (spec.labels || ["x", "y"])[i]));
        v.append(s);
      });
      return v;
    }
    default: {
      if (spec.nullable_label) {                      // e.g. layer friction: null = use the global one
        const box = el("div");
        const lab = el("label", "inline"); const c = el("input"); c.type = "checkbox"; c.checked = get() === null;
        c.onchange = () => { set(c.checked ? null : (getp(P, spec.key) ?? 0.0005)); changed(true); };
        lab.append(c, document.createTextNode(" " + spec.nullable_label));
        box.append(lab);
        if (get() !== null) box.append(slider(get, set, spec, rr));
        return box;
      }
      return slider(get, set, spec, rr);
    }
  }
}

function rows(target, specs, obj) {
  for (const spec of specs) {
    if (!visible(spec, obj)) continue;
    const r = el("div", "row");
    const lab = el("label", null, spec.label); lab.title = spec.label;
    r.append(lab, control(spec, obj));
    r.title = spec.key;
    target.append(r);
    if (spec.hint) target.append(el("div", "hint", spec.hint));
  }
}

function button(text, fn, cls = "small") {
  const b = el("button", cls, text);
  b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); fn(); };
  return b;
}

function card(title, tag, open, key, build, tools) {
  const d = el("details"); d.open = open; d.dataset.key = key;
  const s = el("summary"); s.append(el("span", null, title));
  if (tag) s.append(el("span", "tag", tag));
  s.append(el("span", "spacer"));
  for (const t of tools || []) s.append(t);
  const body = el("div", "body"); build(body);
  d.append(s, body);
  return d;
}

// ------------------------------------------------------------ layers and forces
function sourceName(i, src) {
  if (src === "mouse") return "the mouse";
  if (src === "center") return "the screen centre";
  return `the layer above (${i === 0 ? "the mouse" : P.layers[i - 1].name})`;
}

function pullBox(L, i, p, j) {
  const box = el("div", "pull" + (p.enabled ? "" : " off"));
  const head = el("div", "pullhead");
  const en = el("input"); en.type = "checkbox"; en.checked = p.enabled;
  en.onchange = () => { p.enabled = en.checked; changed(true); };
  const src = el("select");
  for (const v of ["above", "mouse", "center"]) { const o = el("option", null, sourceName(i, v)); o.value = v; src.appendChild(o); }
  src.value = p.source; src.onchange = () => { p.source = src.value; changed(true); };
  head.append(en, document.createTextNode("from"), src, el("span", "spacer"),
              button("Delete", () => { L.pulls.splice(j, 1); changed(true); }));
  box.append(head);
  rows(box, SCHEMA.field, p.field);
  const hint = LAWS[p.field.law];
  if (hint) box.insertBefore(el("div", "hint", hint), box.children[2] || null);
  if (p.source === "above" && i > 0 && P.layers[i - 1].count * L.count > 600000)
    box.append(el("div", "hint", `⚠ ${P.layers[i - 1].count} above × ${L.count} here is too many pairs: this force is skipped`));
  return box;
}

function layerCard(L, i) {
  const n = P.layers.length;
  const tools = [
    button("↑", () => { if (i > 0) { [P.layers[i - 1], P.layers[i]] = [P.layers[i], P.layers[i - 1]]; changed(true); } }),
    button("↓", () => { if (i < n - 1) { [P.layers[i + 1], P.layers[i]] = [P.layers[i], P.layers[i + 1]]; changed(true); } }),
    button("Copy", () => { const c = JSON.parse(JSON.stringify(L)); c.name = nextName(L.name.replace(/\d+$/, "")); P.layers.splice(i + 1, 0, c); changed(true); }),
    button("Delete", () => { P.layers.splice(i, 1); changed(true); }),
  ];
  const count = S && S.counts && S.counts[L.name] !== undefined ? S.counts[L.name] : L.count;
  const above = i === 0 ? "the mouse" : P.layers[i - 1].name;
  return card(`Layer ${i + 1} · ${L.name}`, `${count} · pulled by ${above}`, true, "layer" + i, (b) => {
    SCHEMA.layer.forEach(([title, specs], k) => {
      if (k === 0) { rows(b, specs, L); return; }
      const inner = card(title, null, title === "Motion" || title === "Looks", `layer${i}-${title}`, (x) => rows(x, specs, L));
      b.append(inner);
      if (title === "Motion") {
        b.append(card("Forces (from the layer above only; the mouse and the screen centre reach every layer)", `${L.pulls.length}`, true, `layer${i}-pulls`, (x) => {
          L.pulls.forEach((p, j) => x.append(pullBox(L, i, p, j)));
          x.append(button("+ Add a force", () => {
            L.pulls.push({ source: "above", enabled: true, field: { law: "classic", strength: 20, power: 1,
              min_dist: 5, max_dist: null, inner_radius: 0, inner_gain: 1, outer_gain: 1, radius: 150,
              pulse: 0, period: 8, phase: 0 } });
            changed(true);
          }, ""));
        }));
      }
    });
  }, tools);
}

function nextName(base) {
  base = base || "layer"; let k = 1;
  while (P.layers.some((x) => x.name === `${base}${k}`)) k++;
  return `${base}${k}`;
}

function newLayer(kind) {
  const star = kind === "star";
  const L = JSON.parse(JSON.stringify(S.layer_template || {}));
  Object.assign(L, {
    name: nextName(star ? "star" : "dust"), count: star ? 3 : 15000, look: star ? "dot" : "pixel",
    dot: 8, color_mode: star ? "fixed" : "palette", velocity: star ? "random" : "random",
    pulls: [{ source: "above", enabled: true, field: { law: "classic", strength: star ? 30 : 15, power: 1,
      min_dist: star ? 10 : 3, max_dist: null, inner_radius: 0, inner_gain: 1, outer_gain: 1, radius: 150,
      pulse: 0, period: 8, phase: 0 } }],
  });
  const last = P.layers[P.layers.length - 1];
  if (star && last && last.look === "pixel") P.layers.splice(P.layers.length - 1, 0, L);
  else P.layers.push(L);
  const k = P.layers.indexOf(L);
  if (k > 0 && P.layers[k - 1].count * L.count > 600000) L.pulls[0].source = "mouse";
  changed(true);
}

// ------------------------------------------------------------ page
function render() {
  if (!P || !SCHEMA) return;
  const open = {};
  for (const d of document.querySelectorAll("#form details")) open[d.dataset.key] = d.open;
  const y = window.scrollY;
  const form = $("form");
  form.replaceChildren();
  SCHEMA.preset.forEach(([title, specs], k) =>
    form.append(card(title, k === 0 ? P.title : null, false, "p-" + title, (b) => rows(b, specs, P))));
  form.append(el("div", "sub", "Layers (top to bottom; each one is pulled only by the layer above)"));
  P.layers.forEach((L, i) => form.append(layerCard(L, i)));
  const adders = el("div", "adders");
  adders.append(button("+ Star layer (a few dots that pull)", () => newLayer("star"), ""),
                button("+ Dust layer (many pixels)", () => newLayer("dust"), ""));
  form.append(adders);
  for (const d of form.querySelectorAll("details")) if (open[d.dataset.key] !== undefined) d.open = open[d.dataset.key];
  window.scrollTo(0, y);
  $("desc").textContent = P.description || "";
}

function status(online) {
  const st = $("status");
  if (!online) { st.replaceChildren(el("span", "warn", "● Not connected: is the app running?")); return; }
  const counts = Object.entries(S.counts).map(([k, v]) => `${k} ${v}`).join(" · ");
  st.replaceChildren(document.createTextNode(
    `● ${S.fps.toFixed(0)} fps   ${counts}   ${S.mode}${S.hotkeys ? " · ⌃⌥1-9" : ""}${S.paused ? "   paused" : ""}`));
  if (P) {
    const chain = ["mouse", ...P.layers.map((L) => {
      const extra = [...new Set(L.pulls.filter((p) => p.enabled && p.source !== "above").map((p) => p.source === "mouse" ? "+mouse" : "+centre"))];
      return L.name + (extra.length ? `(${extra.join("")})` : "");
    })];
    st.append(el("br"), el("span", "tree", "levels  " + chain.join(" → ")));
  }
  for (const w of S.problems) st.append(el("br"), el("span", "warn", "⚠ " + w));
  if (S.message) st.append(el("br"), el("span", "msg", S.message));
  $("bPause").textContent = S.paused ? "Resume" : "Pause";
  $("bSave").disabled = !S.editable;
  $("bRename").disabled = !S.editable;
  $("bDelete").disabled = !S.editable;
}

function fillPresets() {
  const s = $("presetSel");
  const sig = JSON.stringify(S.presets) + S.current;
  if (s.dataset.sig === sig) return;
  s.replaceChildren();
  const groups = {};
  for (const [key, title, group, slot] of S.presets) {
    const o = el("option", null, slot ? `${title}  (${slot})` : title); o.value = key;
    if (!group) { s.append(o); continue; }                    // the built-ins, side by side
    if (!groups[group]) { groups[group] = el("optgroup"); groups[group].label = group; s.append(groups[group]); }
    groups[group].append(o);
  }
  if (!S.current) { const o = el("option", null, "(new preset, not saved)"); o.value = ""; s.prepend(o); }
  s.value = S.current || ""; s.dataset.sig = sig;
}

async function poll() {
  try {
    if (!SCHEMA) {
      const r = await fetch("/api/schema"); const j = await r.json();
      SCHEMA = j.schema; LAWS = j.laws;
      const all = [...SCHEMA.preset.flatMap(([, s]) => s), ...SCHEMA.layer.flatMap(([, s]) => s), ...SCHEMA.field];
      for (const spec of all) for (const k of Object.keys(spec.when || {})) WHEN_KEYS.add(k.replace(/^preset\./, ""));
    }
    const r = await fetch("/api/state", { cache: "no-store" });
    S = await r.json();
    if (!S.preset) throw new Error("starting");
    fillPresets();
    if (S.version !== version) { version = S.version; P = S.preset; render(); }
    status(true);
  } catch (e) { status(false); }
  setTimeout(poll, 600);
}

function askName(mode, initial) {
  nameMode = mode;
  $("namebox").classList.add("show");
  $("nameInput").value = initial || "";
  $("nameInput").placeholder = mode === "rename" ? "New name" : "A name, e.g. My Galaxy";
  $("nameInput").focus(); $("nameInput").select();
}
$("nameOk").onclick = () => {
  const name = $("nameInput").value.trim();
  if (!name) return;
  if (nameMode === "saveas") cmd("save", { name, preset: P });
  if (nameMode === "rename") cmd("rename", { key: S.current, name });
  $("namebox").classList.remove("show");
};
$("nameInput").onkeydown = (e) => { if (e.key === "Enter") $("nameOk").click(); if (e.key === "Escape") $("namebox").classList.remove("show"); };

function twoClick(btn, label, fn) {
  let armed = 0;
  btn.onclick = () => {
    if (Date.now() - armed < 3000) { armed = 0; btn.textContent = label; fn(); return; }
    armed = Date.now(); btn.textContent = label + " — sure?";
    setTimeout(() => { btn.textContent = label; }, 3000);
  };
}

$("presetSel").onchange = (e) => { if (e.target.value) cmd("load", { key: e.target.value }); };
$("bNew").onclick = () => cmd("new");
$("bSave").onclick = () => cmd("save", { preset: P });
$("bSaveAs").onclick = () => askName("saveas", "");
$("bRename").onclick = () => askName("rename", P ? P.title : "");
twoClick($("bDelete"), "Delete", () => cmd("delete", { key: S.current }));
$("bReset").onclick = () => cmd("reset");
$("bRestart").onclick = () => cmd("restart");
$("bPause").onclick = () => cmd("pause");
$("bClear").onclick = () => cmd("clear");
twoClick($("bQuit"), "Quit", () => cmd("quit"));

document.addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName) || e.metaKey || e.ctrlKey) return;
  if (/^[1-9]$/.test(e.key)) { cmd("slot", { slot: +e.key }); e.preventDefault(); }
  else if (e.key === " ") { cmd("pause"); e.preventDefault(); }
  else if (e.key === "c") cmd("clear");
  else if (e.key === "r") cmd("restart");
});
poll();
</script>
</body>
</html>
